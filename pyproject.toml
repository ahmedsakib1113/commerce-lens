[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercelens-bi"
version = "1.0.0"
description = "Reproducible business insights from real Olist e-commerce transactions"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<4", "streamlit>=1.50,<2", "altair>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
